name: ZeroShot

options:
  bundleIdPrefix: us.kindcode
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

# Project-wide build settings. Swift 5 language mode is deliberate: strict
# concurrency checking in Swift 6 mode fights the AppKit/Carbon APIs this app
# leans on. UI code is still kept on the main actor by hand.
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: G6U69FC9H3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_EMIT_LOC_STRINGS: NO
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      ENABLE_TESTABILITY: NO
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  ZeroShot:
    type: application
    platform: macOS
    # A single folder reference so new files dropped into Sources/ are picked up
    # by the next `xcodegen generate` without editing this file.
    sources:
      - path: Sources
      # AppIcon.icns is generated by Scripts/make-icon.swift (not an asset
      # catalog, so it just needs to land in Contents/Resources and get named
      # by CFBundleIconFile below). `buildPhase: resources` is required here:
      # a top-level `resources:` key on the target is parsed but silently
      # produces no Copy Bundle Resources phase at all on xcodegen 2.45.3.
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.kindcode.zeroshot
        PRODUCT_NAME: ZeroShot
        COMBINE_HIDPI_IMAGES: YES
        # Intentionally NOT sandboxed: the app shells out to /usr/sbin/screencapture
        # and writes PNGs into user-chosen folders such as ~/Desktop.
        ENABLE_APP_SANDBOX: NO
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: ZeroShot
        CFBundleName: ZeroShot
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu bar only: no Dock icon, no main menu bar of its own.
        LSUIElement: true
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication

  ZeroShotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: ZeroShot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.kindcode.zeroshot.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ZeroShot.app/Contents/MacOS/ZeroShot"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ZeroShot:
    build:
      targets:
        ZeroShot: all
        ZeroShotTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ZeroShotTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
